<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פאות לאה אלבוים · דמו מערכת ניהול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&family=Secular+One&display=swap" rel="stylesheet">
<style>
/* Layout idea: fixed side menu + scrolling work area; the same screens render in two visual languages switched by [data-skin]. */
:root{
  color-scheme: light;
  --font-body:"Assistant","Segoe UI",Arial,sans-serif;
  /* default skin = Atelier */
  --display:"Frank Ruhl Libre","David Libre",Georgia,serif;
  --bg:#F6F1E8; --surface:#FFFDF8; --surface-2:#FBF6EE; --border:#E4D6BF; --hair:#B08D57;
  --text:#2A1F26; --muted:#6E5F66;
  --primary:#6B2D5C; --primary-ink:#FFFFFF; --primary-tint:#F3E7EF;
  --side-bg:#3A1833; --side-text:#F6EEE4; --side-muted:#CDB7C4; --side-active:#55264C; --side-bar:#C9A15A;
  --radius:6px; --radius-sm:4px; --shadow:none; --shadow-lg:0 20px 60px rgba(42,20,36,.25);
  --ok:#2F6B45; --ok-t:#E4F1E8; --warn:#8A5A00; --warn-t:#FBF0D9; --bad:#A63228; --bad-t:#FBE7E4; --info:#245F86; --info-t:#E3EFF7; --mute:#5F5A5D; --mute-t:#EEEBEC;
  --t-prod:#6B2D5C; --t-prod-t:#F3E7EF; --t-upg:#7D5A1E; --t-upg-t:#F6EBD5; --t-comb:#3B5E45; --t-comb-t:#E5EFE7;
  --a-dash:#6B2D5C; --a-dash-t:#F3E7EF; --a-jobs:#6B2D5C; --a-jobs-t:#F3E7EF; --a-new:#6B2D5C; --a-new-t:#F3E7EF;
  --a-cust:#6B2D5C; --a-cust-t:#F3E7EF; --a-pay:#7D5A1E; --a-pay-t:#F6EBD5; --a-clock:#245F86; --a-clock-t:#E3EFF7;
  --a-exp:#5B4A8C; --a-exp-t:#ECE8F6; --a-rep:#3B5E45; --a-rep-t:#E5EFE7;
}
[data-skin="crm"]{
  --display:"Secular One","Assistant",sans-serif;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F8F9FB; --border:#E3E7EE; --hair:#E3E7EE;
  --text:#18202B; --muted:#5C6675;
  --primary:#0E6B6B; --primary-ink:#FFFFFF; --primary-tint:#E2F3F2;
  --side-bg:#FFFFFF; --side-text:#18202B; --side-muted:#5C6675; --side-active:#E2F3F2; --side-bar:#0E6B6B;
  --radius:18px; --radius-sm:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06); --shadow-lg:0 24px 64px rgba(16,24,40,.22);
  --ok:#1E7A46; --ok-t:#E3F5EA; --warn:#9A5B00; --warn-t:#FFF2DB; --bad:#C0352B; --bad-t:#FDE8E6; --info:#1C6A9C; --info-t:#E2F1FA;
  --t-prod:#6A47B8; --t-prod-t:#EFEAFB; --t-upg:#B0386F; --t-upg-t:#FCE8F1; --t-comb:#0E6B6B; --t-comb-t:#E2F3F2;
  --a-dash:#0E6B6B; --a-dash-t:#E2F3F2; --a-jobs:#6A47B8; --a-jobs-t:#EFEAFB; --a-new:#0E6B6B; --a-new-t:#E2F3F2;
  --a-cust:#B0386F; --a-cust-t:#FCE8F1; --a-pay:#9A5B00; --a-pay-t:#FFF2DB; --a-clock:#1C6A9C; --a-clock-t:#E2F1FA;
  --a-exp:#5B4BB0; --a-exp-t:#ECEAFB; --a-rep:#1E7A46; --a-rep-t:#E3F5EA;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--display)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.side{background:var(--side-bg);color:var(--side-text);display:flex;flex-direction:column;padding:22px 14px 16px;gap:18px;overflow-y:auto;border-inline-end:1px solid var(--border)}
[data-skin="atelier"] .side{border-inline-end:1px solid #2A0F25}
.brand{padding:4px 8px 16px;border-bottom:1px solid color-mix(in srgb,var(--side-bar) 45%,transparent)}
.brand .mark{font-family:var(--display);font-size:30px;line-height:1.05;font-weight:900;color:var(--side-bar)}
[data-skin="crm"] .brand .mark{font-weight:400;font-size:32px;color:var(--primary)}
.brand .tag{font-size:12.5px;color:var(--side-muted);margin-top:6px;letter-spacing:.02em}
.brand .sys{font-size:12px;color:var(--side-muted);margin-top:2px}
nav{display:flex;flex-direction:column;gap:3px}
.nav-i{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--radius-sm);background:none;border:0;color:var(--side-text);text-align:start;font-weight:600;font-size:15px;position:relative;width:100%}
.nav-i .tile{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--side-bar)}
[data-skin="crm"] .nav-i .tile{background:var(--acc-t);color:var(--acc)}
.nav-i:hover{background:color-mix(in srgb,var(--side-active) 70%,transparent)}
.nav-i[aria-current="page"]{background:var(--side-active)}
.nav-i[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--side-bar)}
.nav-i .badge{margin-inline-start:auto;background:var(--bad);color:#fff;font-size:12px;font-weight:700;border-radius:20px;padding:0 7px;min-width:22px;text-align:center}
.nav-sep{height:1px;background:color-mix(in srgb,var(--side-muted) 25%,transparent);margin:8px 6px}
.credit{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--side-muted);padding-top:12px}
.credit img{width:120px;height:auto}
.credit .l-dark{display:block}.credit .l-light{display:none}
[data-skin="crm"] .credit .l-dark{display:none}[data-skin="crm"] .credit .l-light{display:block}

.main{overflow-y:auto;height:100%;position:relative}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 14px;color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.skin-switch{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.content{padding:24px 28px 80px;display:flex;flex-direction:column;gap:20px;max-width:1360px}

/* primitives */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
[data-skin="atelier"] .card{border-top:2px solid var(--hair)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.card-h h2{font-size:19px}
.card-h .count{font-family:var(--display);font-size:15px;color:var(--muted)}
.card-h .act{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.card-b{padding:4px 18px 18px}
.ico-tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--acc-t,var(--primary-tint));color:var(--acc,var(--primary));flex:none}
[data-skin="atelier"] .ico-tile{background:none;border:1px solid var(--hair);border-radius:50%;color:var(--hair)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);padding:0 14px;height:40px;font-weight:700;font-size:14.5px;white-space:nowrap;transition:transform .08s,background .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--primary) 88%,#000)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.soft{background:var(--primary-tint);border-color:transparent;color:var(--primary)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.sm{height:34px;padding:0 11px;font-size:13.5px}
.btn.lg{height:48px;padding:0 22px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px 2px 10px;font-size:12.5px;font-weight:700;background:var(--mute-t);color:var(--mute);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.pill.ok{background:var(--ok-t);color:var(--ok)}.pill.warn{background:var(--warn-t);color:var(--warn)}.pill.bad{background:var(--bad-t);color:var(--bad)}.pill.info{background:var(--info-t);color:var(--info)}
.pill.prod{background:var(--t-prod-t);color:var(--t-prod)}.pill.upg{background:var(--t-upg-t);color:var(--t-upg)}.pill.comb{background:var(--t-comb-t);color:var(--t-comb)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr)}
.stack{display:flex;flex-direction:column;gap:12px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--primary-tint);color:var(--primary);flex:none}
[data-skin="atelier"] .av{border-radius:50%;background:var(--surface-2);border:1px solid var(--hair);color:var(--primary);font-family:var(--display)}

/* tip strip */
.tip{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px dashed var(--hair);border-radius:var(--radius);padding:12px 16px}
[data-skin="crm"] .tip{border-color:color-mix(in srgb,var(--primary) 35%,transparent);background:color-mix(in srgb,var(--primary-tint) 55%,#fff)}
.tip .lbl{font-weight:800;font-size:12px;letter-spacing:.04em;color:var(--primary);white-space:nowrap;padding-top:2px}
.tip p{margin:0}
.tip .pain{color:var(--muted)}
.tip .x{margin-inline-start:auto}

/* greeting */
.greet{border-radius:var(--radius);padding:24px 28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:var(--primary);color:var(--primary-ink);position:relative;overflow:hidden}
[data-skin="atelier"] .greet{background:var(--side-bg);border-bottom:2px solid var(--side-bar)}
.greet h1{font-size:32px}
[data-skin="atelier"] .greet h1{color:#F6EEE4}
.greet .sub{opacity:.88;margin-top:4px;font-size:16px}
.greet .date{font-size:13.5px;opacity:.8}
.greet .btn{margin-inline-start:auto;background:#fff;color:var(--primary);border:0}
[data-skin="atelier"] .greet .btn{background:var(--side-bar);color:#2A1424}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kpi{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:4px;position:relative}
.kpi:focus-visible{outline:3px solid var(--primary)}
.kpi .k-l{font-size:13.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .k-v{font-family:var(--display);font-size:30px;line-height:1.1}
.kpi .k-s{font-size:12.5px;color:var(--muted)}
.kpi.attn{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-t)}
.kpi.attn .k-v,.kpi.attn .k-l{color:var(--bad)}

/* due board */
.due{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.due-col{background:var(--surface-2);border-radius:var(--radius-sm);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px;border:1px solid var(--border);min-width:0}
.due-col h3{font-family:var(--font-body);font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:6px;padding:2px 4px}
.due-col.late{background:var(--bad-t);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.due-col.late h3{color:var(--bad)}
.due-col.soon h3{color:var(--warn)}
.jc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;border-inline-start:4px solid var(--tc,var(--border));text-align:start;width:100%}
.jc:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.jc .nm{font-weight:800;font-size:15px}
.jc .it{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc .ft{display:flex;align-items:center;gap:6px;justify-content:space-between;flex-wrap:wrap}
.jc.prod{--tc:var(--t-prod)}.jc.upg{--tc:var(--t-upg)}.jc.comb{--tc:var(--t-comb)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;color:var(--muted);font-size:13.5px;text-align:center}

/* list rows */
.lr{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--border)}
.lr:first-child{border-top:0}
.lr .grow{flex:1;min-width:0}
.lr .t1{font-weight:800}
.lr .t2{font-size:13px;color:var(--muted)}
.lr.attn{background:linear-gradient(to left,var(--bad-t),transparent 60%);box-shadow:inset -4px 0 0 var(--bad);padding-inline-start:10px}
.chk{width:22px;height:22px;accent-color:var(--primary)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;font-weight:800;color:var(--muted);text-align:start;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.attn td:first-child{box-shadow:inset -4px 0 0 var(--bad)}
tr.attn td{background:color-mix(in srgb,var(--bad-t) 60%,transparent)}
tr.soon td:first-child{box-shadow:inset -4px 0 0 var(--warn)}

/* filter tiles */
.ftiles{display:flex;gap:10px;flex-wrap:wrap}
.ftl{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px}
.ftl .n{font-family:var(--display);font-size:20px}
.ftl[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint)}
.ftl:focus-visible{outline:3px solid var(--primary)}

/* page header */
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ph h1{font-size:30px}
.ph .ico-tile{width:46px;height:46px;border-radius:13px}
.ph .act{margin-inline-start:auto;display:flex;gap:8px}

/* forms */
.f{display:flex;flex-direction:column;gap:6px}
.f label,.f .lab{font-weight:800;font-size:14px}
.req{color:var(--bad)}
.in{height:44px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);padding:0 12px;width:100%}
.in:focus{border-color:var(--primary);outline:0;box-shadow:0 0 0 3px var(--primary-tint)}
textarea.in{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:40px;padding:0 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-tint);color:var(--primary)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.type-t{all:unset;cursor:pointer;border:2px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.type-t .ico-tile{width:48px;height:48px}
.type-t b{font-family:var(--display);font-size:22px;font-weight:700}
.type-t span{color:var(--muted);font-size:13.5px}
.type-t[aria-pressed="true"]{border-color:var(--tc);box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 18%,transparent)}
.type-t:focus-visible{outline:3px solid var(--primary)}
.type-t.prod{--tc:var(--t-prod);--acc:var(--t-prod);--acc-t:var(--t-prod-t)}
.type-t.upg{--tc:var(--t-upg);--acc:var(--t-upg);--acc-t:var(--t-upg-t)}
.type-t.comb{--tc:var(--t-comb);--acc:var(--t-comb);--acc-t:var(--t-comb-t)}
.opt{display:grid;grid-template-columns:auto 1fr 130px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.opt:first-child{border-top:0}
.opt .ol{font-weight:700}
.opt .od{font-size:12.5px;color:var(--muted)}
.price{position:relative}
.price input{padding-inline-start:30px;text-align:start;font-variant-numeric:tabular-nums;font-weight:700}
.price::before{content:"₪";position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;pointer-events:none}
.price.changed input{border-color:var(--warn);background:var(--warn-t)}
.note{border:1.5px dashed var(--hair);background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 14px;font-size:13.5px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
[data-skin="crm"] .note{border-color:#C9B6EE;background:#F7F4FE}
.sum{position:sticky;top:76px}
.sum-l{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.sum-t{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--border);margin-top:8px;padding-top:10px}
.sum-t b{font-family:var(--display);font-size:28px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--border);background:var(--surface);border-radius:999px;height:32px;padding:0 12px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--primary);color:var(--primary);background:var(--primary-tint)}

/* switch */
.sw{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-weight:700}
.sw .tr{width:46px;height:26px;border-radius:20px;background:#C9C4C7;position:relative;transition:background .15s}
.sw .kn{position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:inset-inline-start .15s;font-size:11px;color:#888}
.sw[aria-checked="true"] .tr{background:var(--ok)}
.sw[aria-checked="true"] .kn{inset-inline-start:23px;color:var(--ok)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,12,18,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.scrim.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:min(960px,100%);max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column}
.modal.narrow{width:min(520px,100%)}
.m-h{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.m-h h2{font-size:22px}
.m-h .x{margin-inline-start:auto}
.m-b{padding:20px 22px}
.m-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface)}

/* message preview */
.prev{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}
.phone{width:300px;border-radius:38px;background:#16131A;padding:12px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.screen{border-radius:28px;overflow:hidden;background:#EFE7DD;height:560px;display:flex;flex-direction:column;position:relative}
.wa-h{background:#1F5F55;color:#fff;padding:26px 14px 10px;display:flex;align-items:center;gap:10px}
.wa-h .av{background:#fff;color:#1F5F55;width:34px;height:34px;font-size:12px;border:0}
.wa-h b{font-size:14.5px;display:block}
.wa-h small{opacity:.8;font-size:11.5px}
.wa-body{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;background:#EFE7DD}
.bub{background:#fff;border-radius:10px 2px 10px 10px;padding:9px 11px 6px;font-size:13.5px;line-height:1.45;max-width:94%;box-shadow:0 1px 1px rgba(0,0,0,.08);color:#1b1b1b;align-self:flex-start}
.bub .tm{font-size:10.5px;color:#888;text-align:left;margin-top:2px}
.wa-btn{all:unset;cursor:pointer;background:#fff;border-radius:8px;text-align:center;color:#0B7A6C;font-weight:700;font-size:13.5px;padding:9px;max-width:94%;width:94%;align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;gap:6px}
.wa-btn:focus-visible{outline:2px solid #0B7A6C}
.mail{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:#fff;color:#1b1b1b}
.mail-h{padding:12px 16px;border-bottom:1px solid #eee;font-size:13px;color:#555;display:flex;flex-direction:column;gap:2px}
.mail-h b{color:#111;font-size:15.5px}
.mail-b{padding:20px 22px;font-size:14.5px;line-height:1.6}
.mail-b .pay{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.mail-b .pay a{all:unset;cursor:pointer;padding:11px 18px;border-radius:8px;font-weight:800;color:#fff;background:var(--primary);display:inline-flex;gap:8px;align-items:center}
.mail-b .pay a.alt{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.voice{border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;display:flex;gap:14px;align-items:flex-start;background:var(--surface-2)}
.voice .pl{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none;border:0}
.paypage{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;color:#1b1b1b}
.paypage .pp-h{padding:30px 16px 12px;text-align:center;border-bottom:1px solid #eee}
.paypage .pp-b{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1;overflow:auto}
.paypage .in{height:40px;font-size:14px;background:#fafafa;border-color:#ddd}
.paypage .amt{font-family:var(--display);font-size:34px;text-align:center}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{background:none;border:0;padding:10px 14px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;display:inline-flex;gap:7px;align-items:center}
.tab[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}

/* print slip */
.slip{background:#fff;color:#1b1b1b;border:1px solid #ddd;max-width:640px;margin:0 auto;padding:30px 34px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.slip .sh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1b1b1b;padding-bottom:12px;margin-bottom:14px}
.slip h2{font-family:var(--display);font-size:26px}
.slip table td,.slip table th{border-bottom:1px solid #e5e5e5;padding:7px 4px}
.slip .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:34px}
.slip .sig div{border-top:1px solid #555;padding-top:4px;font-size:12px;color:#555}
.slip .terms{font-size:11.5px;color:#666;margin-top:16px;line-height:1.5}

/* clock kiosk */
.kiosk{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.wk{all:unset;cursor:pointer;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:var(--shadow)}
.wk .av{width:62px;height:62px;font-size:22px}
.wk b{font-size:18px}
.wk.on{border-color:var(--ok)}
.wk:focus-visible{outline:3px solid var(--primary)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pad button{height:60px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface-2);font-size:24px;font-weight:700;font-family:var(--display)}
.dots{display:flex;gap:12px;justify-content:center;margin:14px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--primary)}
.dots i.f{background:var(--primary)}
.bigclock{font-family:var(--display);font-size:44px;line-height:1}

/* bars */
.bar{height:10px;border-radius:10px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.bar > i{display:block;height:100%;background:var(--acc,var(--primary));border-radius:10px}
.split{display:flex;height:14px;border-radius:10px;overflow:hidden;gap:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.big-n{font-family:var(--display);font-size:34px;line-height:1.1}
.rep-k{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.rep-k .card{padding:16px 18px}
.rep-k .card.hl{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
[data-skin="atelier"] .rep-k .card.hl{background:var(--side-bg);color:#F6EEE4}
.rep-k .lbl{font-weight:700;font-size:13.5px;opacity:.85}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--font-body)}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1E1A1D;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:all .25s;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{color:#9FE3B4}

/* tour */
.tour-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tour-c{all:unset;cursor:pointer;border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface);transition:box-shadow .15s}
.tour-c:hover{box-shadow:0 8px 24px rgba(0,0,0,.08)}
.tour-c:focus-visible{outline:3px solid var(--primary)}
.tour-c .pain{font-size:14px;color:var(--bad);font-weight:700}
.tour-c b{font-family:var(--display);font-size:18px}
.tour-c span{font-size:13.5px;color:var(--muted)}
.tour-c .go{color:var(--primary);font-weight:800;font-size:13.5px;margin-top:auto;display:flex;gap:6px;align-items:center}

/* ---- v2 additions ---- */
:root{--a-intake:#3B5E45;--a-intake-t:#E5EFE7;--a-log:#245F86;--a-log-t:#E3EFF7;--a-set:#5F5A5D;--a-set-t:#EEEBEC}
[data-skin="crm"]{--a-intake:#0E6B6B;--a-intake-t:#E2F3F2;--a-log:#1C6A9C;--a-log-t:#E2F1FA;--a-set:#4B5563;--a-set-t:#EEF0F3}
nav{gap:1px}
.nav-i{padding:6px 10px;font-size:14.5px}
.nav-i .tile{width:30px;height:30px}
.nav-sep{margin:6px}
.tour-grid{grid-template-columns:repeat(4,1fr)}
/* combobox */
.cb{position:relative}
.cb .in{padding-inline-end:36px}
.cb-car{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex}
.cb-list{position:absolute;z-index:30;top:calc(100% + 4px);inset-inline:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:0 12px 32px rgba(0,0,0,.14);max-height:290px;overflow-y:auto;padding:4px}
.cb-o{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.cb-o span{font-size:12.5px;color:var(--muted)}
.cb-o.act,.cb-o:hover{background:var(--primary-tint)}
.cb-o.add{flex-direction:row;align-items:center;gap:6px;color:var(--primary);font-weight:800;border-top:1px solid var(--border);border-radius:0 0 8px 8px;margin-top:4px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:14px 50%,19px 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-start:12px;padding-inline-end:30px;cursor:pointer}
/* customer note + wig */
.cnote{border:1.5px solid color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-t);border-radius:var(--radius-sm);padding:10px 14px;display:flex;gap:10px;align-items:flex-start;color:var(--text)}
.cnote .lb{font-weight:800;color:var(--warn);white-space:nowrap;display:flex;gap:6px;align-items:center}
.wnote{border:1.5px solid color-mix(in srgb,var(--t-comb) 40%,transparent);background:var(--t-comb-t);border-radius:var(--radius-sm);padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.wnote .lb{font-weight:800;color:var(--t-comb);white-space:nowrap;display:flex;gap:6px;align-items:center}
.smart{border:2px solid var(--t-comb);border-radius:var(--radius-sm);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.smart .ico-tile{--acc:var(--t-comb);--acc-t:var(--t-comb-t)}
.reg{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:800;background:var(--t-comb-t);color:var(--t-comb);white-space:nowrap}
.wig{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2);border-inline-start:4px solid var(--t-comb)}
.wig.noreg{border-inline-start-color:var(--border)}
.wig .wh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wig .wh .in{max-width:260px;font-weight:800;font-family:var(--display);font-size:17px}
.changed{border-color:var(--warn)!important;background:var(--warn-t)!important}
.was{font-size:11.5px;color:var(--warn);font-weight:700}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:20px 22px;position:relative;overflow:hidden}
[data-skin="crm"] .hero::before{content:"";position:absolute;inset-inline:0;top:0;height:5px;background:var(--a-cust)}
.hero .av{width:68px;height:68px;font-size:24px}
.hero h1{font-size:32px}
.hero .act{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border)}
.facts > div{padding:14px 22px;border-inline-start:1px solid var(--border)}
.facts > div:first-child{border-inline-start:0}
.facts .fl{font-size:12.5px;font-weight:800;color:var(--muted)}
.facts .fv{font-family:var(--display);font-size:24px;line-height:1.2}
.savebar{position:sticky;bottom:14px;z-index:25;display:flex;align-items:center;gap:12px;background:var(--side-bg);color:var(--side-text);border-radius:var(--radius);padding:12px 18px;box-shadow:var(--shadow-lg)}
[data-skin="crm"] .savebar{background:#18202B;color:#fff}
.savebar .btn{height:38px}
.savebar .btn:not(.primary){background:transparent;color:inherit;border-color:rgba(255,255,255,.45)}
[dir="ltr"]{unicode-bidi:isolate;white-space:nowrap}
.back{display:inline-flex}
.wigpick{display:flex;flex-direction:column;gap:10px}
.state-sec h3{font-family:var(--font-body);font-size:14px;font-weight:800;margin:6px 0}
.lr.cancel{opacity:.75}
.tmpl{font-family:var(--font-body);line-height:1.6}
.tag-ph{display:inline-block;background:var(--primary-tint);color:var(--primary);border-radius:6px;padding:0 6px;font-weight:700;font-size:12.5px;margin:2px}
.imp td,.imp th{padding:7px 10px;font-size:13.5px}
.jc .pick{position:absolute;inset-inline-end:8px;top:8px}
.jc{position:relative}
.jc.sel{outline:3px solid var(--ok);outline-offset:-1px}
@media (max-width:1100px){.tour-grid{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr 1fr}}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.due{grid-template-columns:1fr 1fr}.g-main,.g2{grid-template-columns:1fr}.rep-k{grid-template-columns:1fr 1fr}.kiosk{grid-template-columns:1fr 1fr}.prev{grid-template-columns:1fr}.tour-grid{grid-template-columns:1fr 1fr}.sum{position:static}}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{flex-direction:row;overflow-x:auto;padding:10px;gap:10px}.brand{border:0;padding:0 6px;min-width:150px}.brand .mark{font-size:20px}.brand .tag,.brand .sys,.credit,.nav-sep{display:none}nav{flex-direction:row}.nav-i{width:auto;white-space:nowrap}.nav-i[aria-current="page"]::before{display:none}.content{padding:16px}.topbar{padding:10px 16px}.kpis,.types,.tour-grid,.g3{grid-template-columns:1fr 1fr}.due{grid-template-columns:1fr}.opt{grid-template-columns:auto 1fr}.opt .price{grid-column:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0}.slip{box-shadow:none;border:0}}
</style>

const CB={};
function combo(id,opts,val,ph,onPick,addLabel){CB[id]={opts,onPick,addLabel};const cur=opts.find(o=>o.v===val);
 return `<div class="cb"><input class="in" id="cb_${id}" data-cbin="${id}" value="${esc(cur?cur.l:'')}" placeholder="${esc(ph)}" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="cbl_${id}" aria-autocomplete="list"><span class="cb-car">${I('chev',16)}</span><div class="cb-list" id="cbl_${id}" role="listbox" hidden></div></div>`}
function cbShow(id,q){const c=CB[id];if(!c)return;const list=$('#cbl_'+id);q=(q||'').trim();
 const m=c.opts.filter(o=>!q||(o.l+' '+(o.s||'')).replace(/-/g,'').includes(q.replace(/-/g,'')));
 list.innerHTML=m.slice(0,60).map((o,i)=>`<div class="cb-o${i===0?' act':''}" role="option" data-cbpick="${id}" data-v="${esc(o.v)}"><b>${esc(o.l)}</b>${o.s?`<span>${esc(o.s)}</span>`:''}</div>`).join('')
  +(!m.length&&!c.addLabel?'<div class="cb-o muted">לא נמצאו תוצאות</div>':'')
  +(c.addLabel?`<div class="cb-o add" role="option" data-cbpick="${id}" data-v="__new">${I('plus',14)} ${c.addLabel}${q?` ״${esc(q)}״`:''}</div>`:'');
 list.hidden=false;$('#cb_'+id).setAttribute('aria-expanded','true')}
function cbHide(id){const l=$('#cbl_'+id);if(l){l.hidden=true;$('#cb_'+id).setAttribute('aria-expanded','false')}}
document.addEventListener('focusin',e=>{const id=e.target.dataset&&e.target.dataset.cbin;if(id){e.target.select();cbShow(id,'')}});
document.addEventListener('focusout',e=>{const id=e.target.dataset&&e.target.dataset.cbin;if(id)setTimeout(()=>cbHide(id),150)});
document.addEventListener('mousedown',e=>{const o=e.target.closest('[data-cbpick]');if(!o)return;e.preventDefault();const id=o.dataset.cbpick;const q=$('#cb_'+id).value;cbHide(id);CB[id].onPick(o.dataset.v,q)});
document.addEventListener('keydown',e=>{const id=e.target.dataset&&e.target.dataset.cbin;if(!id)return;const l=$('#cbl_'+id);if(l.hidden)return;const os=[...l.querySelectorAll('[data-cbpick]')];let i=os.findIndex(o=>o.classList.contains('act'));
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();os[i]&&os[i].classList.remove('act');i=e.key==='ArrowDown'?Math.min(os.length-1,i+1):Math.max(0,i-1);os[i]&&(os[i].classList.add('act'),os[i].scrollIntoView({block:'nearest'}))}
 if(e.key==='Enter'&&os[i]){e.preventDefault();const q=e.target.value;cbHide(id);CB[id].onPick(os[i].dataset.v,q)}

function render(){renderNav();$('#view').innerHTML=tip(S.view)+VIEWS[S.view]();}
const VIEWS={};
function debtCust(){const m={};JOBS.filter(j=>j.st==='done'&&bal(j)>0).forEach(j=>{(m[j.c]=m[j.c]||{c:j.c,a:0,jobs:[],since:j.doneAt}).a+=bal(j);m[j.c].jobs.push(j)});return Object.values(m)}
const monthIncome=()=>PAYS.reduce((s,p)=>s+p.a,0);
const typePill=t=>`<span class="pill ${t}">${TYPES[t].n}</span>`;
const itemsTxt=j=>j.items.map(x=>x[0]).join(' · ');
const nameLink=(c)=>`<a href="#" data-cust="${c.id}" style="color:inherit;font-weight:800;text-decoration:none">${esc(c.n)}</a>`;
const regPill=w=>w&&w.reg?`<span class="reg">${I(w.reg==='wash'?'wind':'scissors',13)} קבוע: ${REGN[w.reg]}</span>`:'';

VIEWS.dashboard=()=>{
 const work=JOBS.filter(j=>j.st==='work').sort((a,b)=>a.due-b.due);
 const late=work.filter(j=>diff(j.due)<0), soon=work.filter(j=>{const n=diff(j.due);return n>=0&&n<=1}), week=work.filter(j=>{const n=diff(j.due);return n>=2&&n<=7}), later=work.filter(j=>diff(j.due)>7);
 const ready=JOBS.filter(j=>j.st==='ready'), debts=debtCust(), fails=JOBS.filter(notReached);
 const h=new Date().getHours();const hi=h<12?'בוקר טוב':h<17?'צהריים טובים':'ערב טוב';
 const urgentN=late.length+soon.length;
 const col=(title,cls,arr,ic)=>`<div class="due-col ${cls}"><h3>${I(ic,15)} ${title} <span class="muted num">(${arr.length})</span></h3>${arr.length?arr.map(jobCard).join(''):`<div class="empty">${I('check',18)}אין עבודות כאן</div>`}</div>`;
 const inNow=SHIFTS.filter(s=>s.d.getTime()===T0.getTime()&&s.out===null);
 return `
 <div class="greet"><div><div class="date">${fmtL(T0)}</div><h1>${hi}, לאה</h1><div class="sub">${urgentN?`${urgentN} עבודות מחכות להיום ומחר, ${late.length} מהן באיחור.`:'אין עבודות דחופות היום.'} ${fails.length?`${fails.length} לקוחות לא קיבלו את ההודעה.`:''}</div></div>
 <div class="row" style="margin-inline-start:auto;gap:10px"><button class="btn lg" data-go="intake" style="background:transparent;color:inherit;border:1.5px solid currentColor">${I('inbox')} קליטת פאות</button><button class="btn lg" data-go="new">${I('plus')} הזמנה חדשה</button></div></div>
 <div class="kpis">
  <button class="kpi attn" data-jobs="late"><span class="k-l">${I('alert',16)} באיחור או להיום</span><span class="k-v num">${late.length+work.filter(j=>diff(j.due)===0).length}</span><span class="k-s">לפי תאריך היעד</span></button>
  <button class="kpi" data-jobs="open"><span class="k-l">${I('list',16)} בעבודה</span><span class="k-v num">${work.length}</span><span class="k-s">${work.filter(j=>j.t==='prod').length} ייצור · ${work.filter(j=>j.t==='upg').length} שדרוג · ${work.filter(j=>j.t==='comb').length} סירוק</span></button>
  <button class="kpi" data-jobs="ready"><span class="k-l">${I('bell',16)} מוכנות לאיסוף</span><span class="k-v num">${ready.length}</span><span class="k-s">${ready.length-fails.length} קיבלו הודעה</span></button>
  <button class="kpi" data-go="payments"><span class="k-l">${I('wallet',16)} חובות פתוחים</span><span class="k-v num">${ils(debts.reduce((s,d)=>s+d.a,0))}</span><span class="k-s">${debts.length} לקוחות</span></button>
  <button class="kpi" data-go="report"><span class="k-l">${I('up',16)} הכנסות החודש</span><span class="k-v num">${ils(monthIncome())}</span><span class="k-s">${PAYS.length} תשלומים נרשמו</span></button>
 </div>
 <div class="card" style="--acc:var(--a-jobs);--acc-t:var(--a-jobs-t)"><div class="card-h"><span class="ico-tile">${I('cal')}</span><h2>בסטודיו, לפי תאריך יעד</h2><span class="count">${work.length} בעבודה</span>
  <div class="act">${S.clear?`<button class="btn sm ghost" data-clear="0">ביטול</button><button class="btn sm ok" data-clearsend ${S.selJ.size?'':'disabled'}>${I('send',15)} סמני ${S.selJ.size} מוכנות ושלחי הודעות</button>`:`<button class="btn sm soft" data-clear="1">${I('check',15)} סימון כמה כמוכנות</button><button class="btn sm ghost" data-go="jobs">כל העבודות</button>`}</div></div>
 <div class="card-b">${S.clear?`<div class="note" style="margin-bottom:12px">${I('info',16)}<span>סמני את הפאות שסיימת. כל לקוחה תקבל הודעה אחת, גם אם סיימת כמה פאות שלה.</span></div>`:''}<div class="due">${col('באיחור','late',late,'alert')}${col('היום ומחר','soon',soon,'clock')}${col('השבוע','week',week,'cal')}${col('בהמשך','later',later,'layers')}</div></div></div>
 <div class="grid g-main">
  <div class="stack">${readySection(ready)}${failSection(fails)}</div>
  <div class="stack">${debtSection(debts)}
   <div class="card" style="--acc:var(--a-clock);--acc-t:var(--a-clock-t)"><div class="card-h"><span class="ico-tile">${I('clock')}</span><h2>בסטודיו עכשיו</h2><div class="act"><button class="btn sm ghost" data-go="clock">לשעון הנוכחות</button></div></div>
   <div class="card-b">${inNow.length?inNow.map(s=>{const w=WORKERS.find(x=>x.id===s.w);return `<div class="lr"><span class="av">${initials(w.n)}</span><div class="grow"><div class="t1">${w.n}</div><div class="t2">${w.role}</div></div><span class="pill ok">נכנסה ${hhmm(s.in)}</span></div>`}).join(''):`<div class="empty">אף עובדת לא החתימה כניסה היום</div>`}</div></div>
  </div>
 </div>`;
};
function jobCard(j){const c=C(j.c),di=dueInfo(j.due),w=WIG(j.w);const sel=S.selJ.has(j.id);
 return `<button class="jc ${j.t} ${sel?'sel':''}" data-${S.clear?'pickj':'job'}="${j.id}" ${S.clear?`aria-pressed="${sel}"`:''}>${S.clear?`<span class="pick">${sel?`<span class="pill ok nodot">${I('check',13)}</span>`:'<span class="pill nodot">בחירה</span>'}</span>`:''}<div class="ft"><span class="nm">${esc(c.n)}</span>${typePill(j.t)}</div><div class="it">${w?esc(w.n)+' · ':''}${esc(itemsTxt(j))}</div><div class="ft"><span class="pill ${di.cls} nodot">${I('cal',13)} ${fmt(j.due)} · ${di.txt}</span>${c.notes||(w&&w.notes)?`<span title="יש הערות" style="color:var(--warn)">${I('note',15)}</span>`:''}</div></button>`}

function readySection(ready){
 const rm=S.remind.ready;const byC={};ready.forEach(j=>{(byC[j.c]=byC[j.c]||[]).push(j)});
 const rows=Object.entries(byC).map(([cid,js])=>{const c=C(+cid);const fail=js.some(notReached);const b=js.reduce((s,j)=>s+bal(j),0);
  return `<div class="lr ${fail?'attn':''}">${rm?`<input type="checkbox" class="chk" data-selr="${cid}" ${S.sel.has(+cid)?'checked':''} aria-label="בחירת ${esc(c.n)}">`:''}<span class="av">${initials(c.n)}</span>
  <div class="grow"><div class="t1">${nameLink(c)} ${js.length>1?`<span class="pill nodot">${js.length} פאות</span>`:''}</div><div class="t2">${js.map(j=>(WIG(j.w)?WIG(j.w).n+': ':'')+itemsTxt(j)).join(' | ')}</div></div>
  ${fail?`<span class="pill bad">לא קיבלה הודעה</span>`:`<span class="pill ok">קיבלה הודעה</span>`}
  ${b>0?`<span class="pill warn nodot num">לתשלום ${ils(b)}</span>`:`<span class="pill ok nodot">שולם</span>`}
  ${rm?'':`<button class="btn sm soft" data-preview="${js[0].id}">${I('chat',15)} ההודעה</button><button class="btn sm" data-deliver="${cid}">${I('check',15)} נמסרה</button>`}</div>`}).join('');
 return `<div class="card" style="--acc:var(--ok);--acc-t:var(--ok-t)"><div class="card-h"><span class="ico-tile">${I('bell')}</span><h2>מוכנות לאיסוף</h2><span class="count">${ready.length}</span>
 <div class="act">${rm?`<button class="btn sm ghost" data-remind="ready">ביטול</button>`:`<button class="btn sm soft" data-remind="ready">${I('send',15)} שליחת תזכורות</button>`}</div></div>
 <div class="card-b">${rm?remindBar('ready',S.sel.size):''}${rows||`<div class="empty">${I('check',20)}אין פאות שמחכות לאיסוף</div>`}</div></div>`}
function failSection(fails){if(!fails.length)return'';
 return `<div class="card" style="--acc:var(--bad);--acc-t:var(--bad-t);border-color:color-mix(in srgb,var(--bad) 40%,transparent)"><div class="card-h"><span class="ico-tile">${I('alert')}</span><h2>הודעות שלא הגיעו</h2><span class="count">${fails.length}</span><div class="act"><button class="btn sm ghost" data-go="log">ליומן ההודעות</button></div></div>
 <div class="card-b">${fails.map(j=>{const c=C(j.c);const n=NOTIFS.find(x=>x.j===j.id&&(x.st==='fail'||x.st==='noanswer'));return `<div class="lr attn"><span class="av">${initials(c.n)}</span><div class="grow"><div class="t1">${nameLink(c)}</div><div class="t2">${n?`${CHN[n.ch][0]}: ${n.det}`:''}</div></div><button class="btn sm" data-resend="${j.id}">${I('retry',15)} שליחה חוזרת</button><button class="btn sm ghost" data-called="${j.id}">${I('phone',15)} דיברתי איתה</button></div>`}).join('')}</div></div>`}
function remindBar(kind,n){const chs=[['wa','WhatsApp','chat'],['mail','מייל','mail'],['voice','שיחה קולית','phone']].filter(c=>kind!=='debt'||c[0]!=='voice');
 return `<div class="note" style="margin-bottom:10px;align-items:center;flex-wrap:wrap">${I('info',16)}<span>סמני לקוחות, בחרי ערוץ ושלחי. בתזכורת יש קישור לתשלום.</span>
 <div class="seg" style="margin-inline-start:auto">${chs.map(c=>`<button data-remch="${c[0]}" aria-pressed="${S.remCh===c[0]}">${I(c[2],15)} ${c[1]}</button>`).join('')}</div>
 <button class="btn primary sm" data-sendrem="${kind}" ${n?'':'disabled'}>${I('send',15)} שליחה ל-${n} לקוחות</button></div>`}
function debtSection(debts){const rm=S.remind.debt;
 return `<div class="card" style="--acc:var(--a-pay);--acc-t:var(--a-pay-t)"><div class="card-h"><span class="ico-tile">${I('wallet')}</span><h2>חובות פתוחים</h2><span class="count num">${ils(debts.reduce((s,d)=>s+d.a,0))}</span>
 <div class="act">${rm?`<button class="btn sm ghost" data-remind="debt">ביטול</button>`:`<button class="btn sm soft" data-remind="debt">${I('send',15)} תזכורת</button>`}</div></div>
 <div class="card-b">${rm?remindBar('debt',S.selD.size):''}${debts.length?debts.map(d=>{const c=C(d.c);return `<div class="lr">${rm?`<input type="checkbox" class="chk" data-seld="${d.c}" ${S.selD.has(d.c)?'checked':''} aria-label="בחירת ${esc(c.n)}">`:''}<span class="av">${initials(c.n)}</span><div class="grow"><div class="t1">${nameLink(c)}</div><div class="t2">${d.since===0?'נמסרה היום':'נמסרה לפני '+(-d.since)+' ימים'}${c.debtAuto?'':' · בלי תזכורות אוטומטיות'}</div></div><b class="num disp" style="font-size:18px">${ils(d.a)}</b>${rm?'':`<button class="btn sm" data-pay="${d.c}">${I('coins',15)} רישום תשלום</button>`}</div>`}).join(''):`<div class="empty">${I('check',20)}אין חובות פתוחים</div>`}</div></div>`}

/* ---- intake (bulk receive) ---- */
function intakeRows(){const it=S.intake;const q=it.q.trim();const rows=[];
 CUST.forEach(c=>c.wigs.forEach(w=>{if(openJobOfWig(w.id)||/בייצור/.test(w.n))return;if(it.f==='reg'&&!w.reg)return;if(q&&!(c.n.includes(q)||c.ph.replace(/-/g,'').includes(q.replace(/-/g,''))||w.n.includes(q)))return;rows.push({c,w})}));
 return rows}
function trOf(w){return S.intake.tr[w.id]||w.reg||'washset'}
function priceOf(w,tr){return w.price&&tr===w.reg?w.price:combBase(tr)[3]}
VIEWS.intake=()=>{const it=S.intake;const rows=intakeRows();const allReg=[];CUST.forEach(c=>c.wigs.forEach(w=>{if(w.reg&&!openJobOfWig(w.id))allReg.push(w)}));
 const selN=it.sel.size;const sum=[...it.sel].reduce((s,wid)=>{const w=WIG(wid);return s+priceOf(w,trOf(w))},0);
 const allSel=rows.length&&rows.every(r=>it.sel.has(r.w.id));
 return `<div class="ph" style="--acc:var(--a-intake);--acc-t:var(--a-intake-t)"><span class="ico-tile">${I('inbox',22)}</span><div><h1>קליטת פאות</h1><div class="muted">פאות של לקוחות שמגיעות לסטודיו. המערכת יודעת מה הטיפול הקבוע של כל פאה.</div></div><div class="act">${backBtn()}</div></div>
 <div class="row" style="flex-wrap:wrap;gap:10px">
  <button class="ftl" data-intf="reg" aria-pressed="${it.f==='reg'}">${I('star')}<span>לקוחות קבועות</span><span class="n num">${allReg.length}</span></button>
  <button class="ftl" data-intf="all" aria-pressed="${it.f==='all'}">${I('book')}<span>כל הפאות שלא בסטודיו</span></button>
  <label class="search" style="max-width:320px;margin-inline-start:auto">${I('search',16)}<input id="intq" data-intq placeholder="חיפוש לקוחה או פאה" value="${esc(it.q)}" aria-label="חיפוש בקליטה"></label>
 </div>
 <div class="grid g-main" style="align-items:start">
 <div class="card"><div class="tbl-wrap"><table><thead><tr><th style="width:40px"><input type="checkbox" class="chk" data-intall ${allSel?'checked':''} aria-label="בחירת הכל"></th><th>לקוחה והפאה</th><th>טיפול</th><th>מחיר</th><th>הערות קבועות</th></tr></thead><tbody>
 ${rows.map(({c,w})=>{const tr=trOf(w);const on=it.sel.has(w.id);const ovr=it.tr[w.id]&&it.tr[w.id]!==w.reg;return `<tr ${on?'style="background:var(--surface-2)"':''}><td><input type="checkbox" class="chk" data-intsel="${w.id}" ${on?'checked':''} aria-label="בחירת ${esc(c.n)} ${esc(w.n)}"></td>
 <td><div class="row"><span class="av">${initials(c.n)}</span><div><div>${nameLink(c)} · <b>${esc(w.n)}</b></div><div class="muted" style="font-size:12.5px">${esc(w.desc)}</div></div></div></td>
 <td style="min-width:200px"><select class="in" style="height:38px" data-inttr="${w.id}" aria-label="טיפול">${CAT.comb.base.map(b=>`<option value="${b[0]}" ${tr===b[0]?'selected':''}>${b[1]}</option>`).join('')}</select><div style="margin-top:4px">${w.reg?(ovr?`<span class="was">שונה מהקבוע (${REGN[w.reg]})</span>`:regPill(w)):'<span class="muted" style="font-size:12px">אין טיפול קבוע, נבחר ברירת מחדל</span>'}</div></td>
 <td class="num"><b>${ils(priceOf(w,tr))}</b>${w.price&&tr===w.reg?'<div class="muted" style="font-size:11.5px">מחיר קבוע ללקוחה</div>':''}</td>
 <td style="max-width:260px;font-size:13px">${w.notes?`<span style="color:var(--t-comb)">${I('note',14)}</span> ${esc(w.notes)}`:'<span class="muted">—</span>'}${c.notes?`<div style="color:var(--warn);font-size:12.5px;margin-top:3px">${I('alert',12)} ${esc(c.notes)}</div>`:''}</td></tr>`}).join('')||`<tr><td colspan="5"><div class="empty">${I('search',20)}לא נמצאו פאות. נסי חיפוש אחר או ״כל הפאות״.</div></td></tr>`}
 </tbody></table></div></div>
 <div class="card sum" style="--acc:var(--a-intake);--acc-t:var(--a-intake-t)"><div class="card-h"><span class="ico-tile">${I('inbox')}</span><h2>נבחרו ${selN} פאות</h2></div><div class="card-b stack">
  <div class="f"><span class="lab">תאריך יעד לכולן</span><div class="chips">${[[1,'מחר'],[2,'יומיים'],[3,'3 ימים'],[7,'שבוע']].map(x=>`<button class="chip" data-intdue="${x[0]}" aria-pressed="${it.due===x[0]}">${x[1]}</button>`).join('')}</div><div class="muted" style="font-size:13px">${fmtL(dOff(it.due))}</div></div>
  <div class="sum-t"><span style="font-weight:800">סה״כ</span><b class="num">${ils(sum)}</b></div>
  <button class="btn primary lg" data-intgo ${selN>1?'':'disabled'}>${I('check')} קליטת ${selN>1?selN:''} פאות יחד</button>
  <button class="btn lg" data-intone ${selN===1?'':'disabled'}>${I('note')} קליטה אישית עם הערות לביקור</button>
  <div class="muted" style="font-size:13px">${I('info',14)} פאה אחת נפתחת בקליטה אישית, עם מקום להערות על הביקור הזה. כמה פאות נקלטות יחד, כל אחת עם הטיפול והמחיר שלה.</div>
 </div></div></div>`};

/* ---- jobs list ---- */
VIEWS.jobs=()=>{
 const f=S.filter;const q=($('#q').value||'').trim();
 let list=JOBS.slice();
 if(f.st==='open')list=list.filter(j=>j.st==='work');else if(f.st==='ready')list=list.filter(j=>j.st==='ready');else if(f.st==='late')list=list.filter(j=>j.st==='work'&&diff(j.due)<=0);else if(f.st==='done')list=list.filter(j=>j.st==='done');
 if(f.type!=='all')list=list.filter(j=>j.t===f.type);
 if(q)list=list.filter(j=>C(j.c).n.includes(q)||C(j.c).ph.replace(/-/g,'').includes(q.replace(/-/g,''))||String(j.id).includes(q));
 list.sort((a,b)=>a.due-b.due);
 const cnt=fn=>JOBS.filter(fn).length;
 const stT=[['open','בעבודה',j=>j.st==='work','list'],['late','באיחור / היום',j=>j.st==='work'&&diff(j.due)<=0,'alert'],['ready','מוכנות',j=>j.st==='ready','bell'],['done','נמסרו',j=>j.st==='done','check']];
 const ST={work:['בעבודה','info'],ready:['מוכנה','ok'],done:['נמסרה','']};
 return `<div class="ph" style="--acc:var(--a-jobs);--acc-t:var(--a-jobs-t)"><span class="ico-tile">${I('list',22)}</span><div><h1>עבודות</h1><div class="muted">${JOBS.length} עבודות · ממוינות לפי תאריך יעד</div></div><div class="act">${backBtn()}<button class="btn primary" data-go="new">${I('plus')} הזמנה חדשה</button></div></div>
 <div class="ftiles">${stT.map(s=>`<button class="ftl" data-fst="${s[0]}" aria-pressed="${f.st===s[0]}">${I(s[3])}<span>${s[1]}</span><span class="n num">${cnt(s[2])}</span></button>`).join('')}
 <span style="width:12px"></span>${[['all','הכל'],['prod','ייצור'],['upg','שדרוג'],['comb','סירוק']].map(t=>`<button class="ftl" data-fty="${t[0]}" aria-pressed="${f.type===t[0]}">${t[0]!=='all'?typePill(t[0]):'כל הסוגים'}</button>`).join('')}</div>
 <div class="card"><div class="tbl-wrap"><table><thead><tr><th>לקוחה</th><th>סוג</th><th>הפאה ומה עושים</th><th>תאריך יעד</th><th>סכום</th><th>יתרה</th><th>סטטוס</th><th></th></tr></thead><tbody>
 ${list.map(j=>{const c=C(j.c),di=dueInfo(j.due),w=WIG(j.w);const late=j.st==='work'&&diff(j.due)<0;const soon=j.st==='work'&&diff(j.due)>=0&&diff(j.due)<=1;
  return `<tr class="click ${late?'attn':soon?'soon':''}" data-job="${j.id}"><td><div class="row"><span class="av">${initials(c.n)}</span><div><b>${esc(c.n)}</b><div class="muted num" style="font-size:12.5px">#${j.id} · <span dir="ltr">${c.ph}</span></div></div></div></td>
  <td>${typePill(j.t)}</td><td style="max-width:300px"><b style="font-size:13.5px">${w?esc(w.n):''}</b> <span class="muted">${esc(itemsTxt(j))}</span></td>

 if(d.repprint){toast('בגרסה המלאה הדו״ח יוצא כ-PDF ונשלח למייל שלך');return}
 if(d.import!==undefined){importModal();return}
 if(d.fst){S.filter.st=d.fst;render();return}
 if(d.fty){S.filter.type=d.fty;render();return}
 if(d.wk){pinModal(+d.wk);return}
 if(d.pin!==undefined){if(d.pin==='⌫')PIN.v=PIN.v.slice(0,-1);else if(PIN.v.length<4)PIN.v+=d.pin;
  if(PIN.v.length===4){const w=WORKERS.find(x=>x.id===PIN.w);const s=SHIFTS.find(s=>s.w===w.id&&s.d.getTime()===T0.getTime()&&s.out===null);const now=nowH();
   if(s){s.out=now;toast(`יציאה נרשמה: ${w.n}, ${hhmm(now)}`)}else{SHIFTS.push({w:w.id,d:new Date(T0),in:now,out:null});toast(`כניסה נרשמה: ${w.n}, ${hhmm(now)}`)}closeModal();render();return}
  drawPin();return}
 /* intake */
 if(d.intf){S.intake.f=d.intf;render();return}
 if(d.intdue){S.intake.due=+d.intdue;render();return}
 if(d.intgo!==undefined){const it=S.intake;const ids=[...it.sel];ids.forEach(wid=>{const w=WIG(wid);const c=CUST.find(c=>c.wigs.includes(w));const tr=trOf(w);JOBS.push({id:NEXT++,c:c.id,w:wid,t:'comb',items:[[combBase(tr)[1]+(w.price&&tr===w.reg?' (מחיר קבוע)':''),priceOf(w,tr)]],due:dOff(it.due),st:'work',paid:0,start:new Date(T0)})});it.sel.clear();it.tr={};S.view='dashboard';render();toast(`נקלטו ${ids.length} פאות, כל אחת עם הטיפול שלה`);return}
 if(d.intone!==undefined){const wid=[...S.intake.sel][0];const w=WIG(wid);const c=CUST.find(c=>c.wigs.includes(w));const tr=trOf(w);S.intake.sel.clear();newFor(c.id,wid);S.wiz.t='comb';S.wiz.comb=tr;S.wiz.autoT=true;S.wiz.due=iso(dOff(S.intake.due));render();return}
 /* customer card */
 if(d.newfor){const [cid,wid]=d.newfor.split(':');newFor(+cid,wid?+wid:null);return}
 if(d.drsw){const c=C(S.custId);const cur=dv(d.drsw,origOf(c,d.drsw));S.draft[d.drsw]=!cur;render();return}
 if(d.drseg){S.draft[d.drseg]=d.val;render();return}
 if(d.drsave!==undefined){saveDraft();return}
 if(d.drcancel!==undefined){S.draft={};render();return}
 if(d.addwig){const c=C(+d.addwig);c.wigs.push(W(NEXTW++,'פאה חדשה','', '', ''));render();toast('נוספה פאה. מלאי את הפרטים ושמרי');return}
 /* settings */
 if(d.settab){S.setTab=d.settab;render();return}
 if(d.setsw){SETTINGS[d.setsw]=!SETTINGS[d.setsw];render();toast('נשמר');return}
 if(d.addcat){toast('בגרסה המלאה נפתח כאן טופס להוספת רכיב למחירון');return}
 /* wizard */
 const w=S.wiz;if(!w)return;
 if(d.newc){w.newC=d.newc==='1';if(w.newC){w.c=null;w.w=null}render();return}
 if(d.wt){if(w.t!==d.wt){w.t=d.wt;w.due=null;w.dep=0;w.autoT=false;const wig=w.w&&WIG(w.w);if(d.wt==='comb'&&wig&&wig.reg){w.comb=wig.reg;if(wig.price)w.pr['c_'+wig.reg]=wig.price}}render();return}
 if(d.prod){const [k,v]=d.prod.split(':');w.prod[k]=v;render();return}
 if(d.qty){w.addQty=Math.max(1,w.addQty+ +d.qty);render();return}
 if(d.duein){w.due=iso(dOff(+d.duein));render();return}
 if(d.save!==undefined){let cid=w.c;if(!cid){cid=Math.max(...CUST.map(c=>c.id))+1;CUST.push({id:cid,n:w.nc.n,ph:w.nc.ph||'050-0000017',em:'',ch:['wa'],since:T0.getFullYear(),debtAuto:true,notes:'',wigs:[]})}
  const c=C(cid);let wid=w.w;if(!wid||w.t==='prod'){wid=NEXTW++;c.wigs.push(W(wid,w.t==='prod'?'פאה חדשה (בייצור)':'פאה נוספת',w.t==='prod'?[CAT.prod.hair.opts.find(o=>o[0]===w.prod.hair)[1],w.prod.length+' ס״מ'].join(' · '):'', '', w.t==='prod'?'בייצור, הזמנה #'+NEXT:''))}
  const L=wizLines();const spec=w.t==='prod'?Object.entries(CAT.prod).map(([k,def])=>def.opts.find(o=>o[0]===w.prod[k])[1]).filter(x=>x!=='בלי').join(' · ')+(w.prod.circ?` · היקף ${w.prod.circ}`:'')+(w.prod.shade?` · גוון ${w.prod.shade}`:''):null;
  const j={id:NEXT++,c:cid,w:wid,t:w.t,items:L.map(x=>[x.l,x.p]),due:new Date(w.due+'T00:00'),st:'work',paid:+w.dep||0,start:new Date(T0),spec,visit:w.visit};JOBS.push(j);
  if(j.paid)PAYS.push({c:cid,j:j.id,a:j.paid,m:'מזומן',d:new Date(T0),k:j.t,note:'מקדמה'});
  const pr=d.save==='1';S.wiz=newWiz();S.view='dashboard';render();toast(`הזמנה #${j.id} נשמרה ונכנסה ללוח לפי תאריך היעד`);if(pr)printModal(j);return}
});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset,w=S.wiz;
 if(d.selr){t.checked?S.sel.add(+d.selr):S.sel.delete(+d.selr);render();return}
 if(d.seld){t.checked?S.selD.add(+d.seld):S.selD.delete(+d.seld);render();return}
 if(d.intsel){const id=+d.intsel;t.checked?S.intake.sel.add(id):S.intake.sel.delete(id);render();return}
 if(d.intall!==undefined){intakeRows().forEach(r=>t.checked?S.intake.sel.add(r.w.id):S.intake.sel.delete(r.w.id));render();return}
 if(d.inttr){S.intake.tr[+d.inttr]=t.value;render();return}
 if(d.wigsel!==undefined){if(t.value==='new'){w.w=null;if(w.autoT){w.t=null;w.autoT=false}}else pickWig(+t.value);render();return}
 if(d.upg){t.checked?w.upg.add(d.upg):w.upg.delete(d.upg);render();return}
 if(d.comb){w.comb=d.comb;render();return}
 if(d.combx){t.checked?w.combX.add(d.combx):w.combX.delete(d.combx);render();return}
 if(d.due!==undefined){w.due=t.value;render();return}
 if(d.price){w.pr[d.price]=num(t.value);render();return}
 if(d.dep!==undefined){w.dep=num(t.value);render();return}
 if(d.rate){WORKERS.find(x=>x.id===+d.rate).rate=+t.value||0;render();return}
 if(d.expfilter!==undefined){S.expFilter=t.value;render();return}
 if(d.ef==='d'||d.ef==='t'||d.ef==='m'){S.expForm[d.ef]=t.value;render();return}
 if(d.catp){const path=d.catp.split('.');let o=CAT;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=num(t.value);toast('המחיר עודכן במחירון');return}
 if(d.setv){SETTINGS[d.setv]=t.value;toast('נשמר');return}
});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset,w=S.wiz;
 if(d.cbin){cbShow(d.cbin,t.value);return}
 if(d.pf){w.prod[d.pf]=t.value;return}
 if(d.visit!==undefined){w.visit=t.value;return}
 if(d.nc){w.nc[d.nc]=t.value;document.querySelectorAll('[data-save]').forEach(b=>b.disabled=!(w.t&&w.nc.n));return}
 if(d.ef==='a'||d.ef==='s'){S.expForm[d.ef]=t.value;const b=document.querySelector('#expForm [type=submit]');if(b)b.disabled=!(S.expForm.a&&S.expForm.t);return}
 if(d.dr){const c=C(S.custId);S.draft[d.dr]=t.value;t.classList.toggle('changed',String(t.value)!==String(origOf(c,d.dr)));updBar();return}
 if(d.intq!==undefined){S.intake.q=t.value;const pos=t.selectionStart;render();const n=$('#intq');n.focus();n.setSelectionRange(pos,pos);return}
 if(t.id==='q'){if(S.view!=='jobs'&&S.view!=='customers'&&t.value){S.view='jobs';S.filter={type:'all',st:'all'}}render();t.focus();return}
});
document.addEventListener('submit',e=>{if(e.target.id!=='expForm')return;e.preventDefault();const f=S.expForm;if(!(f.a&&f.t))return;EXPS.push({d:new Date(f.d+'T00:00'),a:num(f.a),t:f.t,m:f.m,s:f.s,sup:f.sup});S.expForm=null;render();toast('ההוצאה נשמרה ונכנסה לדו״ח החודשי')});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!(e.target.dataset&&e.target.dataset.cbin))closeModal()});
$('#skinSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setSkin(b.dataset.skin)});
function setSkin(s){document.body.dataset.skin=s;document.querySelectorAll('#skinSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.skin===s));try{localStorage.setItem('leah-skin',s)}catch(_){}}
$('#tourBtn').innerHTML=I('compass',16)+' איך זה עוזר לי?';$('#tourBtn').addEventListener('click',tourModal);
$('#srchIco').innerHTML=I('search',16);
setInterval(()=>{const b=$('#bigclock');if(b)b.textContent=hhmm(nowH())},20000);
try{const s=localStorage.getItem('leah-skin');if(s)setSkin(s)}catch(_){}
render();

</script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מערכת ניהול סלון פאות · דמו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#33405F; --brand-tint:#E9ECF4; --gold:#A87A2A; --gold-tint:#F6EEDD;
  --teal:#0E7C74; --teal-tint:#DDF2EF;
  --lilac:#6B4FA8; --lilac-tint:#EEE8F8;
  --amber:#A4630A; --amber-tint:#FBEFD9;
  --sky:#1E6FA8; --sky-tint:#DFEEF9;
  --green:#2E7D3E; --green-tint:#E1F2E4;
  --red:#B4322B; --red-tint:#FBE3E1;
  --grey:#6B7280; --grey-tint:#EEF0F3;
  --bg:#F5F4F1; --card:#fff; --line:#E4E2DC; --ink:#1F2430; --muted:#5E6472;
  --r:18px; --shadow:0 1px 2px rgba(20,24,36,.05),0 6px 18px rgba(20,24,36,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,Arial,sans-serif;font-size:16px}
button{font-family:inherit;cursor:pointer}
.d{font-family:"Secular One",Assistant,sans-serif;font-weight:400}
.app{display:flex;min-height:100vh}
aside{width:250px;background:#fff;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:6px 6px 4px}
.logo .mark{width:46px;height:46px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:24px;position:relative}
.logo .mark:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--gold);bottom:7px;inset-inline-start:7px}
.logo .name{font-size:23px;line-height:1.1}
.sysname{color:var(--muted);font-size:13px;padding:2px 8px 16px}
nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:9px 10px;border-radius:12px;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:3px;position:relative;text-align:start}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--brand-tint)}
nav button.on:before{content:"";position:absolute;inset-inline-start:-16px;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--brand)}
.tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.tile svg{width:19px;height:19px}
.badge{margin-inline-start:auto;background:var(--red);color:#fff;font-size:12px;font-weight:800;border-radius:20px;padding:1px 8px}
.credit{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;text-align:center;font-size:12px;color:var(--muted)}
.credit img{width:110px;display:block;margin:6px auto 0}
main{flex:1;padding:26px 34px 60px;min-width:0}
.topbar{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 42px 0 14px;font:inherit;background:#fff}
.search svg{position:absolute;right:13px;top:12px;width:20px;color:var(--muted)}
.demo-tag{background:var(--gold-tint);color:var(--amber);font-weight:800;font-size:13px;border-radius:20px;padding:5px 12px}
.btn{height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 16px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.s{height:36px;font-size:14px;padding:0 12px}
.btn svg{width:18px}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.ph .tile{width:48px;height:48px;border-radius:14px}.ph .tile svg{width:25px;height:25px}
.ph h1{margin:0;font-size:30px}
.ph .sub{color:var(--muted);font-size:14px}
.ph .act{margin-inline-start:auto;display:flex;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card h3{margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:10px}
.card h3 .tile{width:30px;height:30px}.card h3 .tile svg{width:17px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.4fr 1fr}
.hello{background:linear-gradient(120deg,var(--brand),#4A5A82);color:#fff;border-radius:var(--r);padding:24px 28px;display:flex;align-items:center;gap:16px;margin-bottom:18px}
.hello h2{margin:0;font-size:28px}.hello p{margin:4px 0 0;opacity:.85}
.hello .btn{margin-inline-start:auto;background:var(--gold);border-color:var(--gold);color:#fff}
.kpi{cursor:pointer;transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi .lbl{color:var(--muted);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.kpi .v{font-size:38px;margin-top:6px}
.kpi .h{font-size:13px;color:var(--muted)}
.kpi.att{background:var(--red-tint);border-color:#F1C4C0}.kpi.att .v{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 11px;font-size:13px;font-weight:800;white-space:nowrap}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{background:var(--green-tint);color:var(--green)}.pend{background:var(--amber-tint);color:var(--amber)}
.info{background:var(--sky-tint);color:var(--sky)}.bad{background:var(--red-tint);color:var(--red)}.off{background:var(--grey-tint);color:var(--grey)}
.lil{background:var(--lilac-tint);color:var(--lilac)}.tl{background:var(--teal-tint);color:var(--teal)}
.pipe{display:flex;gap:6px;align-items:stretch}
.pipe .st{flex:1;text-align:center;border-radius:12px;padding:12px 4px;background:var(--bg);cursor:pointer;border:1px solid transparent}
.pipe .st:hover{border-color:var(--teal)}
.pipe .st b{display:block;font-size:28px;font-family:"Secular One";font-weight:400;color:var(--teal)}
.pipe .st span{font-size:13px;font-weight:700}
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--muted);text-align:start;font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.attn td{background:#FFF6F5}tr.attn td:first-child{box-shadow:inset -4px 0 0 var(--red)}
tr.click{cursor:pointer}tr.click:hover td{background:#FAFAF8}
.av{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:14px;margin-inline-end:10px;vertical-align:middle}
.nm{font-weight:800}.sm{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 16px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.tab .c{background:var(--teal-tint);color:var(--teal);border-radius:20px;padding:0 8px;font-size:13px}
.tab.on{border:2px solid var(--teal);background:var(--teal-tint)}
.wigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.wig{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.wig .band{height:6px}
.wig .in{padding:16px;flex:1}
.wig .code{font-size:22px}
.wig .meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.wig .note{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px}
.wig .ft{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px}
.wig .ft .btn{flex:1;justify-content:center}
.steps{display:flex;gap:4px;margin-top:10px}
.steps i{flex:1;height:6px;border-radius:4px;background:var(--line)}
.steps i.d{background:var(--teal)}.steps i.c{background:var(--gold)}
.tl-list{position:relative;padding-inline-start:0;list-style:none;margin:0}
.tl-list li{display:flex;gap:12px;padding:10px 0;position:relative}
.tl-list .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800}
.tl-list li:not(:last-child):after{content:"";position:absolute;right:14px;top:42px;bottom:-8px;width:2px;background:var(--line)}
.field{margin-bottom:14px}
.field label{display:block;font-weight:800;margin-bottom:6px;font-size:15px}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{width:100%;height:44px;border:1px solid #CFCCC4;border-radius:11px;padding:0 12px;font:inherit;background:#fff}
.field textarea{height:80px;padding:10px 12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.seg button.on{border:2px solid var(--brand);background:var(--brand-tint)}
.seg button svg{width:26px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.chk{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer;background:#fff}
.chk.on{border:2px solid var(--teal);background:var(--teal-tint)}
.chk .bx{width:22px;height:22px;border-radius:6px;border:2px solid #B9B6AE;display:grid;place-items:center;color:#fff;font-size:14px}
.chk.on .bx{background:var(--teal);border-color:var(--teal)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
.modal-bg{position:fixed;inset:0;background:rgba(20,24,36,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:22px;max-width:460px;width:100%;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal h2{margin:0 0 4px;font-size:24px}
.workers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.workers button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;font-weight:800;font-size:16px;text-align:start;display:flex;align-items:center;gap:8px}
.workers button.on{border:2px solid var(--teal);background:var(--teal-tint)}
.pin{display:flex;gap:8px;justify-content:center;direction:ltr;margin:6px 0 14px}
.pin input{width:52px;height:56px;text-align:center;font-size:24px;border:1px solid #CFCCC4;border-radius:12px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;display:none;z-index:60}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.bar span{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:8px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.cal{display:grid;grid-template-columns:60px repeat(5,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.cal .h{background:var(--bg);font-weight:800;text-align:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.cal .t{font-size:13px;color:var(--muted);text-align:center;padding-top:6px;border-bottom:1px solid var(--line);height:56px}
.cal .c{border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);height:56px;padding:3px;position:relative}
.ev{border-radius:9px;padding:4px 8px;font-size:13px;font-weight:700;height:100%;overflow:hidden}
.clock{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.clock:last-child{border:0}
.big{font-size:20px}
.money{font-family:"Secular One";font-size:22px}
.split{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.split>div{flex:1;min-width:130px;background:var(--bg);border-radius:12px;padding:10px 12px}
.empty{text-align:center;padding:40px;color:var(--muted)}
.empty svg{width:40px;color:var(--teal)}
.main a,main a{color:var(--sky);font-weight:700;text-decoration:none}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.ro{border:1px dashed #C9C6BE;background:#FAFAF8;border-radius:11px;height:44px;display:flex;align-items:center;padding:0 12px;color:var(--muted)}
@media (max-width:900px){
  .pipe{flex-wrap:wrap}.pipe .st{min-width:calc(25% - 6px)}.demo-tag{display:none}
  .app{flex-direction:column}
  aside{width:100%;height:auto;position:static;padding:12px}
  nav{display:flex;overflow-x:auto;gap:4px}
  nav button{width:auto;white-space:nowrap}
  nav button.on:before{display:none}
  .credit,.sysname{display:none}
  main{padding:16px}
  .g4,.g3{grid-template-columns:1fr 1fr}.g2,.f2,.f3{grid-template-columns:1fr}
  .tbl{overflow-x:auto}
  .cal{grid-template-columns:44px repeat(5,minmax(90px,1fr));overflow-x:auto}
}
</style>
</head>

     <div class="field"><label>מקדמה (₪)</label><input type="number" value="3000"></div></div>
     <div class="hint">⬅ כאן ייכנסו כל הפרמטרים מהטופס שלך. המסלול הקבוע: ${ROUTE.new.join(' ← ')}</div>`:
   itype=='ren'?`<h3 style="margin-top:6px">${tile('brush','teal')}מה צריך לעשות?</h3><div class="checks">${opts.map(o=>`<div class="chk ${renChecks.includes(o)?'on':''}" role="checkbox" tabindex="0" aria-checked="${renChecks.includes(o)}" onclick="tg('${o}')"><span class="bx">${renChecks.includes(o)?'✓':''}</span>${o}</div>`).join('')}</div>
     <div class="hint">המסלול של הפאה: ${opts.filter(o=>renChecks.includes(o)).join(' ← ')||'בחרי לפחות עבודה אחת'}</div>`:
   `<div class="hint">המסלול: ${ROUTE.styl.join(' ← ')} ← מוכנה</div>`}
   <div class="field" style="margin-top:14px"><label>הערות</label><textarea placeholder="מה חשוב לדעת על הפאה הזו"></textarea></div>
   <button class="btn p" onclick="saveIntake()">${ico('check')}קליטה ושליחה לתחנה הראשונה</button></div>`);
};
function tg(o){renChecks=renChecks.includes(o)?renChecks.filter(x=>x!=o):[...renChecks,o];R.intake()}
function saveIntake(){const opts=['עבודת יד','צבע','סקין','חפיפה','סירוק'];
  const route=itype=='new'?ROUTE.new:itype=='ren'?opts.filter(o=>renChecks.includes(o)):ROUTE.styl;if(!route.length){toast('בחרי לפחות עבודה אחת');return}
  const id=Math.max(...wigs.map(w=>w.id))+1;
  wigs.unshift({id,cust:iName.value||'לקוחה חדשה',phone:'050-0000000',type:itype,route,cur:0,due:iDue.value,price:+iPrice.value,paid:itype=='new'?3000:0,sigs:[]});
  toast(`פאה #${id} נקלטה ונשלחה ל${route[0]}`);go('stations',route[0])}

R.hair=()=>{
  M(ph('hair','amber','מלאי שיער','כל משלוח מהספק: מה הגיע, מה נשלח לסקין בסין, מה לניקוי, ומה חזר',`<button class="btn p" onclick="newBatch()">${ico('plus')}קליטת משלוח מהספק</button>`)+
  batches.map(b=>{const sent=b.parts.reduce((s,p)=>s+p.g,0);const left=b.g-sent;
   return `<div class="card" style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    ${tile('box','amber')}<div><div class="d" style="font-size:22px">משלוח ${b.id}</div><div class="sm">${b.sup} · ${b.kind} · ${b.len} · התקבל ${b.in}</div></div>
    <div style="margin-inline-start:auto;display:flex;gap:8px;align-items:center">${b.paidAmt>=b.cost?'<span class="pill ok">שולם לספק</span>':`<span class="pill pend">יתרה לספק ${nis(b.cost-b.paidAmt)}</span>`}<button class="btn s" onclick="openSend('${b.id}')">שליחה לסקין / ניקוי</button></div></div>
    <div class="split"><div><div class="sm">התקבל</div><b class="big">${b.g} גרם</b><div class="sm">${nis(b.cost)}</div></div>
     ${b.parts.map((p,i)=>`<div><div class="sm">${p.d}</div><b class="big">${p.g} גרם</b><div style="margin-top:4px">${p.st=='חזר'?`<span class="pill ok">חזר ${p.back}${p.gb?' · '+p.gb+' גרם':''}</span>`:`<span class="pill info">נשלח ${p.date}</span> <button class="btn s" style="height:28px;font-size:12px" onclick="back('${b.id}',${i})">קליטה</button>`}</div></div>`).join('')}
     <div style="background:var(--amber-tint)"><div class="sm">במחסן</div><b class="big">${left} גרם</b></div></div>
    <div class="bar" style="margin-top:12px">${b.parts.map(p=>`<span style="width:${p.g/b.g*100}%;background:var(--${p.d=='ניקוי'?'sky':'lilac'})"></span>`).join('')}<span style="width:${left/b.g*100}%;background:var(--amber)"></span></div>
    <div class="legend"><span><b style="background:var(--lilac)"></b>סקין - סין</span><span><b style="background:var(--sky)"></b>ניקוי</span><span><b style="background:var(--amber)"></b>במחסן</span></div></div>`}).join(''));
};
function openSend(id){sendTarget=batches.find(b=>b.id==id);sendTxt.textContent=`משלוח ${id} · ${sendTarget.kind}`;send.classList.add('show')}
document.querySelectorAll('#sendDest button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#sendDest button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
function confirmSend(){const d=document.querySelector('#sendDest .on').dataset.v;sendTarget.parts.push({d,g:+sendG.value,st:'נשלח',c:+sendC.value,date:'04/11'});closeM('send');toast(`נרשמה שליחה ל${d}`);R.hair()}
function back(id,i){const p=batches.find(b=>b.id==id).parts[i];p.st='חזר';p.back='04/11';if(p.d=='ניקוי')p.gb=Math.round(p.g*.93);toast('השיער נקלט חזרה במלאי');R.hair()}
function newBatch(){const n='H-'+(121+batches.length-3);batches.unshift({id:n,sup:'ספק שיער',kind:'אירופאי, חום 6',len:'55 ס"מ',g:1000,cost:9000,paidAmt:0,in:'04/11',parts:[]});toast(`משלוח ${n} נקלט`);R.hair()}

function supRows(){
  const r={'ספק שיער':0,'מפעל סקין - סין':0,'ניקוי':0};
  batches.forEach(b=>{r['ספק שיער']+=b.cost;b.parts.forEach(p=>{r[p.d=='ניקוי'?'ניקוי':'מפעל סקין - סין']+=p.c})});
  return Object.entries(r).map(([k,v])=>({k,v,p:supPaid[k]||0}));
}
function totalOwed(){return supRows().reduce((s,x)=>s+x.v-x.p,0)}
R.money=()=>{
  const rows=supRows();const inc=wigs.reduce((s,w)=>s+w.paid,0),exp=rows.reduce((s,x)=>s+x.p,0),open=wigs.reduce((s,w)=>s+w.price-w.paid,0);
  M(ph('money','gold','ספקים ותשלומים','מה שילמת, למי את חייבת, ומה הלקוחות עוד חייבות לך')+
  `<div class="grid g3"><div class="card"><div class="sm">התקבל מלקוחות החודש</div><div class="money" style="font-size:32px;color:var(--green)">${nis(inc)}</div></div>
   <div class="card"><div class="sm">שולם לספקים החודש</div><div class="money" style="font-size:32px">${nis(exp)}</div></div>
   <div class="card"><div class="sm">לקוחות חייבות (פאות פתוחות)</div><div class="money" style="font-size:32px;color:var(--amber)">${nis(open)}</div></div></div><br>
  <div class="card tbl"><h3>${tile('box','amber')}יתרות לספקים</h3><table><tr><th>ספק</th><th>סך חיובים</th><th>שולם</th><th>יתרה</th><th></th></tr>
  ${rows.map(x=>`<tr class="${x.v-x.p>0?'attn':''}"><td class="nm">${x.k}</td><td>${nis(x.v)}</td><td>${nis(x.p)}</td><td>${x.v-x.p>0?`<span class="pill pend">${nis(x.v-x.p)}</span>`:'<span class="pill ok">מאוזן</span>'}</td><td>${x.v-x.p>0?`<button class="btn s" onclick="paySup('${x.k}')">רישום תשלום</button>`:''}</td></tr>`).join('')}</table>
  <div class="hint">החיובים נבנים לבד מקליטת משלוחי השיער ומהשליחות לסקין ולניקוי</div></div><br>
  <div class="card"><h3>${tile('wig','lilac')}עלות מול מחיר · דוגמה לפאה #1045</h3>
   <div class="split"><div><div class="sm">שיער (450 גרם)</div><b>${nis(4275)}</b></div><div><div class="sm">סקין</div><b>${nis(2300)}</b></div><div><div class="sm">ניקוי</div><b>${nis(450)}</b></div><div style="background:var(--green-tint)"><div class="sm">מחיר ללקוחה</div><b>${nis(7500)}</b></div></div>
   <div class="hint">אפשרי אם השיער של כל פאה מקושר למשלוח שלו. לבדוק באפיון אם זה רלוונטי לה</div></div>`);
};
function paySup(k){const r=supRows().find(x=>x.k==k);supPaid[k]=r.v;toast(`נרשם תשלום ל${k}`);R.money()}

function taskRow(x){const late=!x.done&&dnum(x.due)<dnum(TODAY),today=x.due==TODAY;
  return `<div class="clock" style="${late?'background:#FFF6F5;box-shadow:inset -4px 0 0 var(--red);padding-inline:10px;border-radius:10px':''}">
   <button class="chk ${x.done?'on':''}" style="padding:0;border:0;background:none" role="checkbox" aria-checked="${x.done}" aria-label="סימון כבוצע" onclick="event.stopPropagation();doneT(${x.id})"><span class="bx">${x.done?'✓':''}</span></button>
   <div style="flex:1;${x.done?'text-decoration:line-through;color:var(--muted)':''}"><b>${x.t}</b><div class="sm">${x.who}${x.wig?` · <a href="#" onclick="go('card',${x.wig});return false">פאה #${x.wig}</a>`:''}</div></div>
   ${x.done?'<span class="pill ok">בוצע</span>':late?`<span class="pill bad">באיחור · ${x.due}</span>`:today?'<span class="pill pend">היום</span>':`<span class="pill off">${x.due}</span>`}</div>`}
function remRow(r){return `<div class="clock" style="cursor:pointer" onclick="${r.go}"><span class="tile" style="background:var(--${r.k=='bad'?'red':r.k=='info'?'sky':'amber'}-tint);color:var(--${r.k=='bad'?'red':r.k=='info'?'sky':'amber'})">${ico(r.ic)}</span><div style="flex:1"><b>${r.t}</b><div class="sm">${r.s}</div></div><span class="pill ${r.k}">אוטומטי</span></div>`}
function doneT(id){const x=tasks.find(t=>t.id==id);x.done=!x.done;toast(x.done?'כל הכבוד! המשימה סומנה כבוצעה':'המשימה נפתחה מחדש');renderNav();R[page=='wigs'&&x.wig&&document.querySelector('.tl-list')?'card':page](x.wig)}
function quickTask(wid){tasks.unshift({id:Date.now(),t:'לעדכן את הלקוחה לגבי מועד המדידה',who:'מנהלת',due:'06/11',wig:wid,done:false});toast('נוספה משימה לפאה');renderNav();R.card(wid)}
function addTask(){const t=document.getElementById('tT').value.trim();if(!t){toast('מה צריך לעשות?');return}
  tasks.unshift({id:Date.now(),t,who:newWho,due:document.getElementById('tD').value||TODAY,done:false});toast(`המשימה נוספה ל${newWho}`);renderNav();R.tasks()}
R.tasks=()=>{
  const list=tasks.filter(x=>tfil=='open'?!x.done:tfil=='done'?x.done:!x.done&&x.who==tfil).sort((a,b)=>dnum(a.due)-dnum(b.due));
  const rem=autoRem();
  M(ph('task','red','משימות ותזכורות','מה צריך לעשות, מי עושה ועד מתי, ותזכורות שהמערכת מוציאה לבד')+
  `<div class="grid g2"><div><div class="card"><h3>${tile('plus','brand')}משימה חדשה</h3>
    <div class="field"><label>מה צריך לעשות? <span class="req">*</span></label><input id="tT" placeholder="למשל: להזמין סקין נוסף מסין"></div>
    <div class="field"><label>למי</label><div class="seg">${WORKERS.map(w=>`<button class="${newWho==w.n?'on':''}" style="padding:10px;min-width:90px;font-size:15px" onclick="newWho='${w.n}';document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.textContent=='${w.n}'))">${w.n}</button>`).join('')}</div></div>
    <div class="f2"><div class="field"><label>עד מתי</label><input id="tD" value="06/11"></div><div class="field"><label>תזכורת</label><select><option>בבוקר של היום</option><option>יום לפני</option><option>בלי תזכורת</option></select></div></div>
    <button class="btn p" onclick="addTask()">${ico('check')}הוספת משימה</button></div><br>
   <div class="card"><div class="tabs" style="margin-bottom:6px">${[['open','פתוחות'],...WORKERS.map(w=>[w.n,w.n]),['done','בוצעו']].map(([k,l])=>`<button class="tab ${tfil==k?'on':''}" onclick="tfil='${k}';R.tasks()">${l}<span class="c">${tasks.filter(x=>k=='open'?!x.done:k=='done'?x.done:!x.done&&x.who==k).length}</span></button>`).join('')}</div>
    ${list.map(taskRow).join('')||`<div class="empty">${ico('check')}<div>אין כאן משימות</div></div>`}</div></div>
  <div class="card"><h3>${tile('bell','amber')}תזכורות אוטומטיות</h3>
   ${rem.map(remRow).join('')}
   <div class="hint">המערכת יוצרת אותן לבד: משלוח שלא חזר בזמן, פאה מוכנה שלא נאספה, פאה דחופה, יתרה לספק. לחיצה מעבירה למקום הנכון</div></div></div>`);
};
R.att=()=>{
  M(ph('clock','sky','נוכחות','כניסה ויציאה בלחיצה, וסיכום חודשי לשכר')+
  `<div class="grid g2"><div class="card"><h3>${tile('clock','sky')}היום</h3>
   ${att.map((a,i)=>`<div class="clock"><span class="av" style="background:var(--sky-tint);color:var(--sky)">${a.w[0]}</span><div style="flex:1"><b>${a.w}</b><div class="sm">${a.in?'נכנסה '+a.in:'עוד לא נכנסה'}${a.out?' · יצאה '+a.out:''}</div></div>
    ${!a.in?`<button class="btn g s" onclick="clk(${i},'in')">כניסה</button>`:!a.out?`<button class="btn s" onclick="clk(${i},'out')">יציאה</button>`:'<span class="pill off">סיימה</span>'}</div>`).join('')}</div>
  <div class="card tbl"><h3>${tile('sig','teal')}סיכום נובמבר</h3><table><tr><th>עובדת</th><th>שעות</th><th>שלבים שחתמה</th></tr>
   <tr><td class="nm">רחל</td><td class="d">23.5</td><td>7</td></tr><tr><td class="nm">מרים</td><td class="d">19</td><td>6</td></tr>
   <tr><td class="nm">שושי (פרילנס)</td><td class="sm">לפי עבודה</td><td>2 · <span class="pill pend">לתשלום ${nis(560)}</span></td></tr></table>
   <div class="hint">לפרילנסרית: החתימות על השלבים הן הדוח שלפיו משלמים לה</div></div></div>`);
};
function clk(i,t){const n=new Date();att[i][t]=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');toast(t=='in'?'כניסה נרשמה':'יציאה נרשמה');R.att()}

R.cal=()=>{
  const days=['ראשון 1/11','שני 2/11','שלישי 3/11','רביעי 4/11','חמישי 5/11'],hrs=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00'];
  const ev={'3-0':['ש. פרידמן · מדידה','lilac'],'3-2':['פ. כץ · איסוף','green'],'3-4':['ייעוץ להזמנה','sky'],'3-7':['ד. קליין · איסוף','green'],'0-1':['מ. שטרן · מדידה','lilac'],'1-3':['א. ברגר · קבלת שיפוץ','teal'],'2-5':['ח. לנדאו · מדידה','lilac'],'4-1':['ב. וייס · איסוף','green'],'4-6':['הזמנה חדשה','sky']};
  let g='<div class="h"></div>'+days.map(d=>`<div class="h">${d}</div>`).join('');
  hrs.forEach((h,hi)=>{g+=`<div class="t">${h}</div>`;days.forEach((d,di)=>{const e=ev[di+'-'+hi];g+=`<div class="c">${e?`<div class="ev" style="background:var(--${e[1]}-tint);color:var(--${e[1]})">${e[0]}</div>`:''}</div>`})});
  M(ph('cal','green','יומן תורים','מדידות, קבלת פאות ואיסופים',`<button class="btn p" onclick="toast('בדמו: כאן נפתח טופס תור חדש')">${ico('plus')}תור חדש</button>`)+`<div class="cal">${g}</div>
  <div class="legend" style="margin-top:12px"><span><b style="background:var(--lilac)"></b>מדידה</span><span><b style="background:var(--green)"></b>איסוף</span><span><b style="background:var(--teal)"></b>קבלת פאה</span><span><b style="background:var(--sky)"></b>ייעוץ</span></div>`);
};
go('home');
</script>
</body>
</html>
